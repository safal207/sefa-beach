name: Living Intelligence regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/menu-economics.test.mjs tests/living-restaurant-context.test.mjs tests/living-intelligence.test.mjs
