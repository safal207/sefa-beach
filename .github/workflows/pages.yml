name: Sefa Beach Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sefa-beach-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and stage static demo
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, hashlib, json, os, pathlib, shutil, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          root = pathlib.Path('.')
          menu = json.loads((root/'menu-baseline.json').read_text(encoding='utf-8'))
          assert len(menu) == 123 and len({item['id'] for item in menu}) == 123
          for name in ('index.html', 'revenue-dashboard-local.html'):
              html = (root/name).read_text(encoding='utf-8')
              assert '</html>' in html.lower(), name
          with (root/'sales-lines-template.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.reader(f))
          assert len(rows) == 1 and rows[0][0] == 'order_id', 'Never publish real sales data'
          with (root/'sales-context-template.csv').open(encoding='utf-8', newline='') as f:
              context = list(csv.reader(f))
          assert len(context) == 1 and context[0] == rows[0] + ['service_date', 'service_hour', 'service_zone'], 'Context template must never contain actual sales data'
          assert 'noindex,nofollow' in (root/'index.html').read_text(encoding='utf-8')
          public = root/'_site'
          public.mkdir(exist_ok=True)
          for name in ('index.html', 'revenue-dashboard-local.html', 'menu-baseline.json', 'sales-lines-template.csv', 'sales-context-template.csv', '.nojekyll'):
              shutil.copyfile(root/name, public/name)
          assets = sorted(p for p in public.iterdir() if p.is_file() and not p.name.startswith('.'))
          manifest = {'schema': 'sefa-release-v1', 'commit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in assets}}
          (public/'release-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact published release
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 scripts/verify-pages.py --site "$SITE_URL" --manifest _site/release-manifest.json --report pages-evidence.json
      - name: Archive deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/release-manifest.json
            pages-evidence.json
          retention-days: 14
          if-no-files-found: warn
