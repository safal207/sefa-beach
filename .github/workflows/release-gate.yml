name: Sefa Beach v3 release gate
on:
  pull_request:
    branches: [main, 'release/**', 'ci/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sefa-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  logic:
    name: Exact-head deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify head and run tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'head=%s\nnode=%s\n' "$EXPECTED_SHA" "$(node --version)" > evidence/run.txt
          node --test tests/*.test.mjs 2>&1 | tee evidence/logic.log
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee evidence/pages-contract.log
      - name: Upload exact-head logic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logic-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
  browser:
    name: Browser regression / ${{ matrix.engine }}
    needs: logic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      SEFA_BROWSER: ${{ matrix.engine }}
      SEFA_EVIDENCE_DIR: evidence/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'head=%s\nengine=%s\nnode=%s\n' "$EXPECTED_SHA" "$SEFA_BROWSER" "$(node --version)" > evidence/run.txt
      - name: Install pinned Playwright and browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1 2>&1 | tee evidence/install.log
          npx --no-install playwright install --with-deps "$SEFA_BROWSER" 2>&1 | tee -a evidence/install.log
      - name: Cross-module browser regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/release-browser.mjs 2>&1 | tee evidence/browser.log
      - name: Summarize result
        if: always()
        run: |
          printf '### Browser regression (%s)\n- Commit: %s\n- Job result: %s\n' "$SEFA_BROWSER" "$EXPECTED_SHA" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if test -f evidence/browser.log; then
            printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 evidence/browser.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.engine }}-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
