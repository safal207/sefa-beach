name: Sefa Lighthouse laboratory profile
on:
  pull_request:
    branches: [main, 'release/**', 'ci/**']
    paths:
      - 'index.html'
      - 'revenue-dashboard-local.html'
      - 'lighthouse/**'
      - 'scripts/summarize-lighthouse.mjs'
      - '.github/workflows/lighthouse-sefa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sefa-lighthouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Lighthouse / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SEFA_LH_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned audit tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm install --no-save --package-lock=false playwright@1.56.1 @lhci/cli@0.15.1
          npx --no-install playwright install --with-deps chromium
      - name: Collect local Lighthouse measurements
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          npx --no-install lhci collect --config=lighthouse/lighthouserc.cjs
          node scripts/summarize-lighthouse.mjs .lighthouseci
      - name: Archive raw and summarized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lighthouse-${{ matrix.profile }}-${{ env.EXPECTED_SHA }}-${{ github.run_id }}
          path: |
            .lighthouseci/
            .artifacts/performance/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
